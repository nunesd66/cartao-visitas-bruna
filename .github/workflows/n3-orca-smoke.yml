name: Orca accessibility smoke

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/n3-orca-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the screen reader and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y orca speech-dispatcher-espeak-ng xvfb xauth xdotool

      - name: Run keyboard navigation with Orca and Firefox
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash <<'BASH'
          set -euo pipefail
          output="$RUNNER_TEMP/bruna-orca.log"
          profile="$(mktemp -d)"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/bruna-orca-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" "${reader:-}" "${browser:-}" 2>/dev/null || true' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://127.0.0.1:8765/ >/dev/null

          gsettings set org.gnome.desktop.interface toolkit-accessibility true
          speech-dispatcher --spawn
          orca --version
          orca --replace --enable=speech --disable=braille --debug --debug-file="$output" \
            > "$RUNNER_TEMP/bruna-orca-process.log" 2>&1 &
          reader=$!
          timeout 15 bash -c 'until grep -Fq "SPEECH OUTPUT: " "$1" 2>/dev/null; do sleep 0.2; done' _ "$output"

          cat > "$profile/user.js" <<'PREFS'
          user_pref("accessibility.force_disabled", -1);
          user_pref("browser.aboutwelcome.enabled", false);
          user_pref("browser.translations.automaticallyPopup", false);
          PREFS
          firefox --version
          firefox --no-remote --profile "$profile" --kiosk http://127.0.0.1:8765/ \
            > "$RUNNER_TEMP/bruna-orca-firefox.log" 2>&1 &
          browser=$!

          window="$(timeout 35 xdotool search --sync --onlyvisible --name 'Bruna Eduarda Beauty' | head -n 1)"
          xdotool windowfocus --sync "$window"
          if ! timeout 20 bash -c 'until grep -Fq "PROCESS OBJECT EVENT document:load-complete" "$1"; do sleep 0.2; done' _ "$output"; then
            echo 'Orca did not process the document load event.' >&2
            exit 1
          fi
          for step in {1..20}; do
            xdotool key --clearmodifiers Tab
            sleep 0.75
            if grep -i 'SPEECH OUTPUT' "$output" | grep -iF 'Recusar' >/dev/null; then
              break
            fi
          done
          kill -0 "$reader"
          speech="$(grep -i 'SPEECH OUTPUT' "$output")"
          printf '%s\n' "$speech"
          printf '%s\n' "$speech" | grep -iF 'Pular para o conteúdo'
          printf '%s\n' "$speech" | grep -iF 'Recusar'
          echo 'Orca announced the skip link and the privacy rejection button.'
          BASH

      - name: Preserve screen-reader test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orca-smoke-logs
          path: ${{ runner.temp }}/bruna-orca*.log
          retention-days: 7
          if-no-files-found: warn
