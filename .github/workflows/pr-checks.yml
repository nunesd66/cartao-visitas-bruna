name: Pull request checks

on:
  pull_request:
    branches:
      - master
      - 'refactor/bruna-*'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed HTML matches the section fragments
        run: |
          npm run build:html
          git diff --exit-code -- index.html

      - name: Verify committed CSS matches SCSS
        run: |
          npm run build:css
          git diff --exit-code -- css/style.css

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Check analytics JavaScript syntax
        run: node --check js/analytics.js

      - name: Check privacy JavaScript syntax
        run: node --check js/privacy.js

      - name: Check map JavaScript syntax
        run: node --check js/map.js

      - name: Run all Node regression tests
        run: npm test

      - name: Report asset weights
        shell: bash
        run: node scripts/report-asset-sizes.mjs "$(git rev-parse HEAD^1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check local asset references
        run: node scripts/check-local-assets.mjs
