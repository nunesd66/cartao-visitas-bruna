name: Pull request checks

on:
  pull_request:
    branches:
      - master
      - 'refactor/bruna-*'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed HTML matches the section fragments
        run: |
          npm run build:html
          git diff --exit-code -- index.html

      - name: Verify committed CSS matches SCSS
        run: |
          npm run build:css
          git diff --exit-code -- css/style.css

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Run all Node regression tests
        run: npm test

      - name: Report asset weights
        shell: bash
        run: node scripts/report-asset-sizes.mjs "$(git rev-parse HEAD^1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check local asset references
        run: node scripts/check-local-assets.mjs

      - name: Build and verify the static package
        shell: bash
        run: |
          npm run build
          cmp index.html dist/index.html
          cmp css/style.css dist/css/style.css
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > "$RUNNER_TEMP/pages-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://127.0.0.1:8765/ >/dev/null
          node scripts/smoke-public.mjs http://127.0.0.1:8765/
