name: Pull request checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed CSS matches SCSS
        run: |
          npm run build:css
          git diff --exit-code -- css/style.css

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Check analytics JavaScript syntax
        run: node --check js/analytics.js

      - name: Check privacy JavaScript syntax
        run: node --check js/privacy.js

      - name: Check map JavaScript syntax
        run: node --check js/map.js

      - name: Test site interactions and analytics consent
        run: node --test scripts/analytics.test.mjs scripts/privacy.test.mjs scripts/carousel.test.mjs scripts/map.test.mjs scripts/brand.test.mjs scripts/faq.test.mjs

      - name: Check SEO metadata consistency
        run: node --test scripts/seo.test.mjs

      - name: Test third-party privacy guards
        run: node --test scripts/third-party-guards.test.mjs

      - name: Check local asset references
        run: node scripts/check-local-assets.mjs

      - name: Test accessibility structure and safe links
        run: node --test scripts/a11y-structure.test.mjs
