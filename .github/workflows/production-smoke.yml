name: Production smoke

on:
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke-manual
  cancel-in-progress: false

jobs:
  smoke:
    name: Validate published assets
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'github-pages' &&
      github.event.deployment.ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0

      - name: Check public site
        shell: bash
        env:
          DEPLOYMENT_SHA: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || '' }}
        run: |
          set -o pipefail
          args=()
          if [[ -n "$DEPLOYMENT_SHA" ]]; then
            args=(--published-sha "$DEPLOYMENT_SHA")
          fi
          node scripts/smoke-public.mjs https://nunesd66.github.io/cartao-visitas-bruna/ "${args[@]}" | tee smoke-result.txt

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## Production smoke'
            echo ''
            echo '- URL: https://nunesd66.github.io/cartao-visitas-bruna/'
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Repository revision checked out: $GITHUB_SHA"
            echo '- Note: repository revision does not prove which commit GitHub Pages published.'
            echo '- This smoke checks HTTP status, media types and presence of content.'
            echo ''
            echo '### Output'
            echo '```text'
            if [ -f smoke-result.txt ]; then cat smoke-result.txt; else echo 'Smoke did not produce output.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-result
          path: smoke-result.txt
          if-no-files-found: warn
          retention-days: 14
